name: Tests

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  backend-tests:
    name: Back-end tests
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      -
        name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd flask; pip install -r requirements.txt
      -
        name: Run tests
        # The tests are in flask/: from the root of the repository, unittest finds none ("NO TESTS RAN")
        run: cd flask && python -m unittest discover -s test -t .
  frontend-tests:
    name: Front-end tests
    if: ${{ false }}  # Disabled as there are no tests
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Setup Node
        uses: actions/setup-node@v4.0.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: angular/package-lock.json
      -
        name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
      -
        name: Run tests
        run: cd angular; npm i; CHROMIUM_BIN=$(which chrome) npm test
  frontend-lint:
    name: Front-end linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4.0.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: angular/package-lock.json
      - name: Run linting
        run: cd angular; npm i; npm run lint
