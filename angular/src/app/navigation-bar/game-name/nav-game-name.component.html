<ng-container *transloco="let t; read 'navbar'">
  @if (currentGameInfo) {
    <span class="fs-5 fw-semibold ellipsis">{{ currentGameInfo.name }}&nbsp;</span>
    <div class="d-inline-flex align-items-center gap-1 ms-1">
      <button class="btn btn-icon"
        *transloco="let t"
        [attr.aria-label]="t('buttons.link')"
        [ngbTooltip]="t('buttons.link')"
        placement="bottom"
        (click)="copyLink()"
        >
        <svg class="bi" fill="currentColor" aria-hidden="true">
          <use xlink:href="assets/bootstrap-icons.svg#link-45deg"/>
        </svg>
      </button>
      <button class="btn btn-icon"
        *transloco="let t"
        [attr.aria-label]="t('buttons.qrcode')"
        [ngbTooltip]="t('buttons.qrcode')"
        placement="bottom"
        (click)="displayQrCode()"
        >
        <svg class="bi" fill="currentColor" aria-hidden="true">
          <use xlink:href="assets/bootstrap-icons.svg#qr-code"/>
        </svg>
      </button>
    </div>
  }
</ng-container>
