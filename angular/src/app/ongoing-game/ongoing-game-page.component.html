<shpp-container [themeToggle]="false">
  <ng-container navbar>
    <div class="d-flex flex-column flex-grow-1 min-w">
      <shpp-game-name class="d-flex align-items-center min-w" />
      <shpp-game-info class="d-flex align-items-center min-w" />
    </div>
    <shpp-nav-player-info class="flex-shrink-0" />
  </ng-container>

  <ng-container content>
    <div class="d-flex flex-column flex-lg-row flex-grow-1">
      <div class="d-flex flex-column flex-grow-1 main-column">
        <shpp-current-story />
        <shpp-card-table class="flex-grow-1" />
        @if (showSummary) {
          <shpp-turn-summary class="dock" />
        }
        @if (!showSummary) {
          <shpp-card-picker class="dock" />
        }
      </div>
      <div class="stories-column">
        <shpp-stories-panel />
        <shpp-agent-access />
      </div>
    </div>
  </ng-container>
</shpp-container>
