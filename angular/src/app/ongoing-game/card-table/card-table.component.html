<div class="container flex-grow-1 d-flex justify-content-evenly flex-wrap align-items-center">
  @for (player of (state | keyvalue); track player.key) {
    <shpp-player-hand
      [playerState]="player.value"
      [deck]="deck">
    </shpp-player-hand>
  }
</div>
<div class="d-flex justify-content-center align-items-center flex-wrap gap-2 mb-4 px-3" *transloco="let t; read 'buttons'">
  <shpp-story-name class="story-name" />
  <button class="btn btn-primary" (click)="revealCards()" [disabled]="!canReveal" >{{ t('reveal') }}</button>
  <button class="btn btn-primary" (click)="endTurn()" [disabled]="canReveal">{{ t('newTurn') }}</button>
</div>
