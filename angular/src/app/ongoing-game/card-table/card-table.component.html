<div class="container flex-grow-1 d-flex flex-wrap align-items-center table-seats" [class.justify-content-evenly]="!compact" [class.justify-content-center]="compact" [class.compact]="compact">
  @for (player of (state | keyvalue); track player.key) {
    <shpp-player-hand
      [playerState]="player.value"
      [deck]="deck">
    </shpp-player-hand>
  }
</div>
<div class="d-flex justify-content-center flex-wrap gap-2 mb-4 px-3" *transloco="let t; read 'buttons'">
  <button class="btn px-4" [class.btn-primary]="canReveal" [class.btn-outline-secondary]="!canReveal" (click)="revealCards()" [disabled]="!canReveal">{{ t('reveal') }}</button>
  <button class="btn px-4" [class.btn-primary]="!canReveal" [class.btn-outline-secondary]="canReveal" (click)="endTurn()" [disabled]="canReveal">{{ t('newTurn') }}</button>
</div>
<shpp-departures class="departures" />
