<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Planning poker">
  <!--
    A glass card over an emerald tile. The glass is an approximation of the "liquid glass" look made of gradients
    (a bright edge, a sheen and light patches seen through the card): SVG has no real backdrop blur.
  -->
  <defs>
    <linearGradient id="tile" x1="80" y1="0" x2="430" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b385"/>
      <stop offset="1" stop-color="#04503a"/>
    </linearGradient>
    <radialGradient id="mint" cx="130" cy="120" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bf0cb" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8bf0cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="410" cy="440" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#01271c" stop-opacity=".6"/>
      <stop offset="1" stop-color="#01271c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".56"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".38" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".66" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="-122" y="-164" width="244" height="328" rx="40" fill="#000" transform="translate(246 264) rotate(-8)"/>
    </mask>
    <clipPath id="card"><rect x="-122" y="-164" width="244" height="328" rx="40"/></clipPath>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#012017" flood-opacity=".38"/>
    </filter>
    <filter id="engrave" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#012017" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#mint)"/>
  <rect width="512" height="512" rx="116" fill="url(#deep)"/>

  <!-- the card behind -->
  <g mask="url(#behind)"><g transform="translate(266 248) rotate(13)">
    <rect x="-122" y="-164" width="244" height="328" rx="40" fill="#fff" fill-opacity=".14"/>
    <rect x="-122" y="-164" width="244" height="328" rx="40" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-opacity=".7"/>
  </g></g>

  <!-- the card in front -->
  <g transform="translate(246 264) rotate(-8)">
    <g filter="url(#lift)">
      <rect x="-122" y="-164" width="244" height="328" rx="40" fill="url(#glass)"/>
    </g>
    <g clip-path="url(#card)">
      <ellipse cx="-30" cy="-196" rx="250" ry="150" fill="url(#sheen)"/>
    </g>
    <rect x="-122" y="-164" width="244" height="328" rx="40" fill="none" stroke="url(#edge)" stroke-width="4"/>
    <rect x="-114" y="-156" width="228" height="312" rx="33" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
    <g fill="#fff" fill-opacity=".97" filter="url(#engrave)">
      <circle cx="-84" cy="28" r="16"/>
      <circle cx="-28" cy="16" r="28"/>
      <circle cx="56" cy="0" r="44"/>
    </g>
  </g>
</svg>
